[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-usr-hospital-route"
version = "0.1.0"
description = "院内配送机器人洁污通行领域契约"
requires-python = ">=3.11"

[project.scripts]
hospital-route = "hospital_route.cli:main"

[tool.setuptools.packages.find]
where = ["src"]